{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">

    <!-- File Upload Form -->
    <h2>Upload a File</h2>
    <form method="POST" enctype="multipart/form-data" action="{% url 'home' %}">
        {% csrf_token %}
        <div class="mb-3">
            <input type="file" name="uploaded_file" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Upload</button>
    </form>

    <hr>

    <!-- List of Uploaded Files -->
    <h2>Uploaded Files</h2>
    {% if uploaded_files %}
    <ul class="list-group">
        {% for file in uploaded_files %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{{ file.file.url }}" target="_blank">{{ file.file.name }}</a>
            <form method="POST" action="{% url 'home' %}" style="display: inline;">
                {% csrf_token %}
                <input type="hidden" name="delete_file" value="{{ file.id }}">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No files uploaded yet.</p>
    {% endif %}
</div>
{% endblock %}
